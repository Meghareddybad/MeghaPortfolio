name: Build, Test & CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-ci:
    name: Build & Test ASP.NET Core Backend
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 9 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore Backend Dependencies
      run: dotnet restore backend/MeghaPortfolio.sln

    - name: Build Backend Solution
      run: dotnet build backend/MeghaPortfolio.sln --configuration Release --no-restore

    - name: Execute NUnit Automated Tests
      run: dotnet test backend/MeghaPortfolio.sln --configuration Release --no-build --verbosity normal

  frontend-ci:
    name: Build React Frontend Bundle
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Frontend Dependencies
      working-directory: frontend/megha-portfolio-ui
      run: npm ci

    - name: Build Vite Production Assets
      working-directory: frontend/megha-portfolio-ui
      run: npm run build
